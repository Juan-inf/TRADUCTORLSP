# ── Semana 6 — Variante B: Combinación tardía con cross-attention (ST-GCN + BiLSTM) ─
# Proyecta embeddings al mismo espacio y aplica multi-head attention entre ramas.
# Reproducir: .venv310/bin/python scripts/run_semana6.py --strategy attention

experiment:
  name: "semana6_attention"
  description: "Combinación tardía ST-GCN v2 + BiLSTM v2 — cross-attention 8 heads"
  seed: 42

dataset:
  manifest: "data/manifest_segments.csv"
  label2idx: "data/label2idx.json"
  n_frames: 30
  n_nodes: 75
  n_channels: 3

backbones:
  stgcn:
    checkpoint: "checkpoints/stgcn_v2_best.pt"
    frozen: true
    embedding_dim: 128
  bilstm:
    checkpoint: "checkpoints/bilstm_v2_best.pt"
    frozen: true
    embedding_dim: 256

combinacion:
  strategy: "attention"
  hidden_dim: 256           # proyección común antes de attention
  num_heads: 8
  dropout: 0.3
  n_classes: 26

training:
  epochs: 30
  batch_size: 64
  optimizer: "AdamW"
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  patience: 10
  label_smoothing: 0.05

output:
  checkpoint: "checkpoints/semana6_attention_best.pt"
  log: "logs/semana6_attention.txt"
