# ── Semana 6 — Experimento Baseline: ST-GCN v2 sobre landmarks ───────────────
# Modelo ST-GCN con hidden=128, 80 épocas, SWA, label smoothing
# Reproducir: .venv310/bin/python scripts/run_training_v2.py --hidden 128 --epochs 80

experiment:
  name: "semana6_baseline_stgcn_v2"
  description: "ST-GCN v2 sobre landmarks MediaPipe — baseline Semana 6"
  seed: 42

dataset:
  manifest: "data/manifest_segments.csv"
  label2idx: "data/label2idx.json"
  n_frames: 30
  n_nodes: 75        # 42 manos + 33 pose
  n_channels: 3      # x, y, z normalizadas

splits:
  train: 0.70
  val:   0.15
  test:  0.15
  strategy: "temporal_per_video"
  seed: 42

model:
  architecture: "stgcn"
  hidden_channels: 128
  num_layers: 6
  n_classes: 26
  dropout: 0.3

training:
  epochs: 80
  batch_size: 64
  optimizer: "AdamW"
  lr: 1.0e-3
  weight_decay: 2.0e-4
  scheduler: "cosine_with_warmup"
  warmup_epochs: 3
  patience: 15
  label_smoothing: 0.1
  grad_clip: 1.0
  swa_start: 60
  swa_lr_factor: 0.1

augmentation:
  gaussian_noise_prob: 0.7
  gaussian_noise_sigma: 0.015
  flip_horizontal_prob: 0.5
  speed_variation_prob: 0.6
  speed_range: [0.6, 1.4]
  keypoint_dropout_prob: 0.3
  keypoint_dropout_n: [1, 8]
  global_scale_prob: 0.4
  global_scale_range: [0.8, 1.2]
  rotation_prob: 0.4
  rotation_deg: 15

output:
  checkpoint: "checkpoints/semana6_stgcn_v2_best.pt"
  log: "logs/semana6_stgcn_v2.txt"
